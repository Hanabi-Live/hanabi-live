version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /experimental/rust-server
      - /experimental/rust-server/engine
    schedule:
      interval: weekly
  - package-ecosystem: rust-toolchain
    directory: /experimental/rust-server
    schedule:
      interval: weekly
