version: 2

# Update every ecosystem in one weekly pull request.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: bun
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    # Keep in sync with the version locks in "package-metadata.json".
    ignore:
      - dependency-name: typescript
  - package-ecosystem: cargo
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: rust-toolchain
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
