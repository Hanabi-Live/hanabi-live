runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash # Composite jobs must specify the shell.
