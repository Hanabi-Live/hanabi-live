runs:
  using: composite

  steps:
    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Identify the runner image
      id: platform
      run: echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: bun-runtime-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'packages/*/package.json', '.npmrc', 'patches/**', '.github/workflows/setup/action.yml') }}

    - name: Install dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      run: bun install --frozen-lockfile
      shell: bash # Composite jobs must specify the shell.

    - name: Restore repository lifecycle setup
      if: steps.dependencies.outputs.cache-hit == 'true'
      run: bun run prepare
      shell: bash

    - name: Cache the clean installation
      if: steps.dependencies.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
