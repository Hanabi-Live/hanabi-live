name: Go Chat Preflight

on:
  push:
    branches:
      - refactor/typed-chat-messages

jobs:
  go_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
      - name: Run Go unit tests
        run: go test ./... -count=1
        working-directory: ./server/src
