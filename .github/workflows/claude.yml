name: Claude

# Runs Claude Code when someone with write access mentions @claude in an issue,
# an issue or pull request comment, or a pull request review. The action rejects
# mentions from users without write access.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/workflows/setup-bun
      - name: Create the "version.js" file
        run: bash ./scripts/dev/set-version.sh
      - uses: ./.github/workflows/setup-rust
      - uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(bash lint.sh:*),Bash(bash scripts/dev/generate-protocol.sh),Bash(bun:*),Bash(bunx:*),Bash(cargo:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --append-system-prompt "Follow AGENTS.md, except: never push to main, deploy, or connect to the production server. When asked to fix an issue, first decide whether it describes a real, reproducible problem with a clear fix. If it does not, reply explaining why and make no changes. Otherwise fix it on your branch, run bash lint.sh and the relevant tests, push, and open a pull request against main with gh pr create, using a Conventional Commits title and a body that says Fixes #<issue number>."
