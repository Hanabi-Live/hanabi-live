name: Claude

# Runs Claude Code when someone with write access mentions @claude in an issue,
# an issue or pull request comment, or a pull request review. The action rejects
# mentions from users without write access. It also investigates each issue that
# the server opens for a client error, which has the "client-error" label. Only
# people with write access can add a label.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'client-error')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/workflows/setup-bun
      - name: Create the "version.js" file
        run: bash ./scripts/dev/set-version.sh
      - uses: ./.github/workflows/setup-rust
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          # Uses the Claude subscription of the account that made the token.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The server opens the issues for client errors as this GitHub App.
          allowed_bots: hanabi-live-issues-bot
          claude_args: |
            --allowedTools "Bash(bash lint.sh:*),Bash(bash scripts/dev/generate-protocol.sh),Bash(bun:*),Bash(bunx:*),Bash(cargo:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git fetch:*),Bash(git worktree:*)"
            --append-system-prompt "Follow AGENTS.md, except: never push to main, deploy, or connect to the production server. When asked to fix an issue, first decide whether it describes a real, reproducible problem with a clear fix. If it does not, reply explaining why and make no changes. Otherwise fix it on your branch, run bash lint.sh and the relevant tests, push, and open a pull request against main with gh pr create, using a Conventional Commits title and a body that says Fixes #<issue number>."
          # An issue for a client error starts the investigation by itself. Other
          # events wait for an @claude mention.
          prompt: >-
            ${{ github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'client-error') && format('Investigate the client error in issue {0}. Read it with gh issue view. It lists the positions in the minified scripts of the stack. Each script name holds the commit of this repository that built it, such as main.<commit>.min.js. The player''s browser can run an older script than the server''s release, so use the commit in the script name. To read the positions, fetch that commit with git fetch --depth=1 origin <commit>, add a worktree for it with git worktree add, and run bun install --frozen-lockfile and bun run build-client there. Then map each position to its source line with the source map that the build wrote to public/js/bundles, using the source-map-js package. Find the cause in the code on main. If the cause and the fix are clear, fix it as for any other issue. Otherwise, comment on the issue with gh issue comment: give the decoded stack, what you found, and what is still unknown.', github.event.issue.number) || '' }}
