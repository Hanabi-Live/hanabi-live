# cspell:ignore GOCACHE GOMODCACHE
name: Set up Go with build-specific caching
description: Keep normal, race, and static build caches separate.
inputs:
  cache-key:
    description: Distinguishes different builds within a matrix job.
    default: default
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: go
      with:
        go-version: "1.27.x"
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ inputs.cache-key }}-${{ hashFiles('server/src/go.sum', 'maintenance/go.sum', 'install/migration_files.sh', '.github/workflows/setup-go/action.yml') }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ inputs.cache-key }}-
