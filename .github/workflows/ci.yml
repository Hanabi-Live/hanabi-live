name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  client_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/setup
      - run: bash ./packages/client/build_client.sh

  release_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release installation and deployment guards
        run: python3 -m unittest discover -s install -p '*_test.py'

      - name: Test the maintenance server
        run: python3 -m unittest discover -s maintenance -p '*_test.py'

  container_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache container dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dependencies
          outputs: type=cacheonly
          cache-from: type=gha,scope=hanabi-container
          cache-to: type=gha,scope=hanabi-container,mode=min,ignore-error=true
      - name: Build the production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hanabi-live-ci
          # A cache-only prepare does not materialize layers for this separate build.
          cache-from: type=gha,scope=hanabi-container

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/setup
      - uses: ./.github/workflows/setup-rust
        if: matrix.shard == 2
      - name: Run the lint shard
        run: bash lint.sh --shard=${{ matrix.shard }}/2

  test:
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/setup

      - name: Create the "version.js" file
        run: bash ./packages/client/set_version.sh

      - uses: ./.github/workflows/setup-redis

      - uses: ./.github/workflows/setup-rust

      - name: Test the TypeScript code
        run: bun run test

  client_new:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [flows, audits, restart]
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/setup
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Start version-matched preinstalled browsers
        run: |
          version=$(bun -p 'require("@playwright/test/package.json").version')
          docker run --detach --rm --init --ipc=host --network=host \
            --name hanabi-playwright \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$(command -v bun):/usr/local/bin/bun:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            bun node_modules/playwright/cli.js run-server --host 127.0.0.1 --port 3000
          bun run - <<'JS'
          import { chromium } from "playwright";
          import { setTimeout } from "node:timers/promises";
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const browser = await chromium.connect("ws://127.0.0.1:3000/", { timeout: 3000 });
              await browser.close();
              break;
            } catch (error) {
              console.error(`Browser readiness attempt ${attempt}:`, error);
              if (attempt === 10) throw error;
              await setTimeout(1000);
            }
          }
          JS
      - run: bash packages/client/build_client.sh
      - name: Test lobby state, transport and safe rendering
        if: matrix.suite == 'flows'
        run: bunx --bun --no-install vitest run
        working-directory: packages/client-new
      - name: Test both clients and restart latency against Rust
        run: |
          case "${{ matrix.suite }}" in
            flows) selectors=(--grep-invert '@audit|@restart') ;;
            audits) selectors=(--grep '@audit') ;;
            restart) selectors=(--grep '@restart' --project rust --workers 1) ;;
            *) echo "Unknown browser suite." >&2; exit 1 ;;
          esac
          bunx --bun --no-install playwright test "${selectors[@]}"
        working-directory: packages/client-new
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
      - name: Stop browser container
        if: always()
        run: |
          if docker container inspect hanabi-playwright > /dev/null 2>&1; then
            docker logs hanabi-playwright
            docker stop hanabi-playwright
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: new-lobby-browser-failures-${{ matrix.suite }}
          path: packages/client-new/test-results

  server_build:
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Identify the SQLx cache platform
        id: platform
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "bin=${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_OUTPUT"
      - name: Restore pinned SQLx tooling
        id: sqlx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.platform.outputs.bin }}/sqlx
            ${{ steps.platform.outputs.bin }}/cargo-sqlx
          key: sqlx-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-${{ hashFiles('rust-toolchain.toml', 'server/sqlx_schema.py') }}
      - name: Install pinned SQLx metadata tooling
        if: steps.sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Cache pinned SQLx tooling
        if: steps.sqlx.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.platform.outputs.bin }}/sqlx
            ${{ steps.platform.outputs.bin }}/cargo-sqlx
          key: ${{ steps.sqlx.outputs.cache-primary-key }}
      - name: Check SQLx metadata against a disposable schema
        run: |
          python3 -m unittest discover -s . -p sqlx_schema_test.py
          python3 sqlx_schema.py
      - name: Test Rust rules, actors, and Redis/PostgreSQL durability
        run: |
          cargo test --locked --manifest-path protocol/Cargo.toml
          cargo test --locked
          cargo test --locked --manifest-path engine/Cargo.toml

  native_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/workflows/setup
      - uses: ./.github/workflows/setup-go
        with:
          cache-key: migration-tool
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Prepare static Rust release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cd server
          rustup target add x86_64-unknown-linux-musl
      - name: Build and verify immutable native release
        run: bash install/build_release.sh dist/native
      - name: Test release installation guards
        run: python3 -m unittest discover -s install -p 'release_test.py'
      - name: Exercise local release lifecycle
        run: python3 install/release_smoke.py dist/native/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: |
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish_native_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        client_build,
        server_build,
        container_build,
        lint,
        test,
        release_tests,
        client_new,
        native_release,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: dist/native
      - name: Verify candidate checksums before publication
        working-directory: dist/native
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: |
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          overwrite: true

  deploy_docs_website:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/setup

      - name: Use TypeDoc to automatically generate documentation
        run: bun run docs
        working-directory: ./packages/game

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./packages/game/docs

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  discord:
    name: Discord Failure Notification
    needs:
      [
        client_build,
        server_build,
        container_build,
        lint,
        test,
        release_tests,
        client_new,
        native_release,
        publish_native_release,
        deploy_docs_website,
      ]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: ""
