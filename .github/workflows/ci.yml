name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            HANABI_BUILD_REVISION=${{ github.sha }}
          load: true
          tags: hanabi-live-ci
          cache-from: type=gha,scope=hanabi-container
          cache-to: type=gha,scope=hanabi-container,mode=max,ignore-error=true

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun
      - run: bash ./packages/client/build-client.sh

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release installation and deployment guards
        run: python3 -m unittest discover -s install -p '*_test.py'

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun
      - uses: ./.github/workflows/setup-rust
        if: matrix.shard == 2
      - name: Restore spelling file cache
        if: matrix.shard == 2
        id: cspell-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cspell
          key: cspell-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'cspell.config.jsonc', '.gitignore', 'check-spelling.sh', 'scripts/cspell_cache_test.py', '.github/workflows/cspell-unused-words.yml') }}-${{ github.sha }}
          restore-keys: |
            cspell-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'cspell.config.jsonc', '.gitignore', 'check-spelling.sh', 'scripts/cspell_cache_test.py', '.github/workflows/cspell-unused-words.yml') }}-
      - name: Test spelling cache invalidation
        if: matrix.shard == 2 && steps.cspell-cache.outputs.cache-matched-key == ''
        run: python3 -m unittest discover -s scripts -p 'cspell_cache_test.py'
      - name: Restore successful package lint results
        id: lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: lint-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            lint-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('bun.lock', 'turbo.json') }}-
      - name: Test Turbo cache invalidation
        if: matrix.shard == 1
        run: python3 -m unittest discover -s scripts -p 'lint_cache_test.py'
      - name: Test formatting cache invalidation
        if: matrix.shard == 1
        run: python3 -m unittest discover -s scripts -p 'prettier_cache_test.py'
      - name: Restore formatting file cache
        if: matrix.shard == 1
        id: prettier-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prettier
          key: prettier-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'prettier.config.mjs', '.prettierignore', '.editorconfig', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'misc/*/tsconfig*.json', 'check-prettier.sh') }}-${{ github.sha }}
          restore-keys: |
            prettier-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'prettier.config.mjs', '.prettierignore', '.editorconfig', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'misc/*/tsconfig*.json', 'check-prettier.sh') }}-
      - name: Run the lint shard
        run: bash lint.sh --shard=${{ matrix.shard }}/2
      - name: Cache successful formatting results
        if: matrix.shard == 1 && steps.prettier-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prettier
          key: ${{ steps.prettier-cache.outputs.cache-primary-key }}
      - name: Cache successful package lint results
        if: steps.lint-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
      - name: Cache successful spelling results
        if: matrix.shard == 2 && steps.cspell-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cspell
          key: ${{ steps.cspell-cache.outputs.cache-primary-key }}

  test:
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun

      - name: Create the "version.js" file
        run: bash ./packages/client/set-version.sh

      - uses: ./.github/workflows/setup-redis

      - uses: ./.github/workflows/setup-rust

      - name: Restore successful JavaScript test results
        id: test-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: test-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            test-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'turbo.json') }}-

      - name: Test the TypeScript code
        run: bunx --bun --no-install turbo run "//#test" --cache=local:rw

      - name: Cache successful JavaScript test results
        if: steps.test-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.test-cache.outputs.cache-primary-key }}

  client-new:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [flows, audits]
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Start version-matched preinstalled browsers
        run: |
          version=$(bun -p 'require("@playwright/test/package.json").version')
          docker run --detach --rm --init --ipc=host --network=host \
            --name hanabi-playwright \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$(command -v bun):/usr/local/bin/bun:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            bun node_modules/playwright/cli.js run-server --host 127.0.0.1 --port 3000
          bun run - <<'JS'
          import { chromium } from "playwright";
          import { setTimeout } from "node:timers/promises";
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const browser = await chromium.connect("ws://127.0.0.1:3000/", { timeout: 3000 });
              await browser.close();
              break;
            } catch (error) {
              console.error(`Browser readiness attempt ${attempt}:`, error);
              if (attempt === 10) throw error;
              await setTimeout(1000);
            }
          }
          JS
      - run: bash packages/client/build-client.sh
      - name: Restore successful Vitest results
        if: matrix.suite == 'flows'
        id: vitest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: vitest-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'turbo.json') }}-
      - name: Test lobby state, transport and safe rendering
        if: matrix.suite == 'flows'
        run: bunx --bun --no-install turbo run "@hanabi-live/client-new#test" --cache=local:rw
      - name: Cache successful Vitest results
        if: matrix.suite == 'flows' && steps.vitest-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.vitest-cache.outputs.cache-primary-key }}
      - name: Test both clients against Rust
        run: |
          case "${{ matrix.suite }}" in
            flows) selectors=(--grep-invert '@audit') ;;
            audits) selectors=(--grep '@audit') ;;
            *) echo "Unknown browser suite." >&2; exit 1 ;;
          esac
          bunx --bun --no-install playwright test "${selectors[@]}"
        working-directory: packages/client-new
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
      - name: Stop browser container
        if: always()
        run: |
          if docker container inspect hanabi-playwright > /dev/null 2>&1; then
            docker logs hanabi-playwright
            docker stop hanabi-playwright
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: new-lobby-browser-failures-${{ matrix.suite }}
          path: packages/client-new/test-results

  server-build:
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Identify the SQLx cache platform
        id: platform
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "bin=${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_OUTPUT"
      - name: Restore pinned SQLx tooling
        id: sqlx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.platform.outputs.bin }}/sqlx
            ${{ steps.platform.outputs.bin }}/cargo-sqlx
          key: sqlx-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-${{ hashFiles('rust-toolchain.toml', 'server/sqlx_schema.py') }}
      - name: Install pinned SQLx metadata tooling
        if: steps.sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Cache pinned SQLx tooling
        if: steps.sqlx.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.platform.outputs.bin }}/sqlx
            ${{ steps.platform.outputs.bin }}/cargo-sqlx
          key: ${{ steps.sqlx.outputs.cache-primary-key }}
      - name: Check SQLx metadata against a disposable schema
        run: |
          python3 -m unittest discover -s . -p sqlx_schema_test.py
          python3 sqlx_schema.py
      - name: Test Rust rules, actors, and Redis/PostgreSQL durability
        run: |
          cargo test --locked --manifest-path protocol/Cargo.toml
          cargo test --locked
          cargo test --locked --manifest-path engine/Cargo.toml

  native-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HANABI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun
      - uses: ./.github/workflows/setup-go
        with:
          cache-key: migration-tool
      - uses: ./.github/workflows/setup-redis
      - uses: ./.github/workflows/setup-rust
      - name: Prepare static Rust release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cd server
          rustup target add x86_64-unknown-linux-musl
      - name: Build and verify immutable native release
        run: bash install/build-release.sh dist/native
      - name: Test release installation guards
        run: python3 -m unittest discover -s install -p 'release_test.py'
      - name: Exercise local release lifecycle
        run: python3 install/release_smoke.py dist/native/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: |
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-native-release:
    # Installed deployment tooling identifies this job by its API-visible name.
    name: publish_native_release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        client-build,
        server-build,
        lint,
        test,
        release-tests,
        client-new,
        native-release,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: dist/native
      - name: Verify candidate checksums before publication
        working-directory: dist/native
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hanabi-live-rust-${{ github.sha }}-linux-amd64
          path: |
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          overwrite: true

  deploy-docs-website:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup-bun

      - name: Use TypeDoc to automatically generate documentation
        run: bun run docs
        working-directory: ./packages/game

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./packages/game/docs

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  discord:
    name: Discord Failure Notification
    needs:
      [
        client-build,
        server-build,
        container-build,
        lint,
        test,
        release-tests,
        client-new,
        native-release,
        publish-native-release,
        deploy-docs-website,
      ]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: ""
