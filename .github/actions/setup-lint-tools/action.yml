name: Set up the lint tools
description: Installs the programs that "lint.sh" needs, other than Bun, Rust, and what the runner image includes.

runs:
  using: composite
  steps:
    - name: Install the Rust dependency checkers
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      with:
        tool: cargo-deny@0.20.2,cargo-machete@0.9.2

    - name: Install actionlint
      shell: bash
      env:
        VERSION: 1.7.12
        SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        archive="actionlint_${VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive"
        echo "$SHA256  $archive" | sha256sum --check --strict
        tar -xzf "$archive" actionlint
        sudo install -m 755 actionlint /usr/local/bin/actionlint
        rm "$archive" actionlint
