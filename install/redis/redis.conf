bind 127.0.0.1
protected-mode yes
port 0
unixsocket /run/hanabi-redis/redis.sock
unixsocketperm 770
daemonize no
supervised no
dir /var/lib/hanabi-redis
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
maxmemory 768mb
maxmemory-policy noeviction
save 900 1
logfile ""
