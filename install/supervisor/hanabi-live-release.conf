; OPT-IN ONLY: install after the old source service has fully stopped.
; Adjust the dedicated root and service account before installing this file.
[program:hanabi-live-release]
directory=/opt/hanabi-live
command=/opt/hanabi-live/current/hanabi-live
user=hanabi
autostart=false
autorestart=unexpected
exitcodes=0
; Even a deliberate stop immediately after startup must not be retried.
startsecs=0
stopsignal=TERM
; Never force a timeout-based kill while saving checkpoints. Use the HTTP shutdown
; path or send TERM directly, and verify exit before changing this configuration.
stopwaitsecs=86400
redirect_stderr=true
stdout_logfile=/opt/hanabi-live/shared/logs/hanabi-live.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=50
