{# Applies the dark mode setting that this browser cached before the stylesheets
load, to avoid a flash of the light theme. The cache key and value must match
"packages/client/src/theme.ts". #}
<script type="text/javascript">
  try {
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  } catch (e) {}
</script>
