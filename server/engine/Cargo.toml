[package]
name = "hanabi_engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
hanabi_protocol = { path = "../protocol" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints whose fixes add boilerplate rather than catch mistakes: these crates are not
# published libraries, and splitting long handlers or the wire structs would not clarify them.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
