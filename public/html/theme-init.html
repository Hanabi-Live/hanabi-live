<!--
  Applies the saved dark mode theme before the stylesheets load to avoid a flash of the light
  theme. Unset preferences default to light. The preference logic must match the one in
  "packages/client/src/theme.ts".
-->
<script type="text/javascript">
  try {
    var t = localStorage.getItem("darkMode");
    var isDark =
      t === "true"
      || (t === "system"
        && window.matchMedia
        && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (isDark) {
      document.documentElement.dataset.theme = "dark";
    }
  } catch (e) {}
</script>
