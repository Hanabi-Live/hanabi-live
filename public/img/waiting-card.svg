<svg xmlns="http://www.w3.org/2000/svg" width="640" height="64" viewBox="0 0 640 64">
  <!-- The sides of the Hanabi card that turns over while the page waits for the server, from left
       to right: each suit's face, with the back between them. Each side is 64 by 64 pixels. The
       "waiting-card" class in "public/css/app/common.css" turns the card and shows one side at a
       time. The animation is in the page, not in this image, so that every card starts on the first
       side when it appears. (Chrome runs the animation of an image on one clock for each URL.)
       The suit symbols are copied from "pips/suits/no-variant". -->
  <defs>
    <pattern id="lattice" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1" height="5" fill="#fff" fill-opacity="0.12" />
      <rect width="5" height="1" fill="#fff" fill-opacity="0.12" />
    </pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <g id="back">
      <rect x="12" y="4" width="40" height="56" rx="4" fill="#1b242b" />
      <rect x="12" y="4" width="40" height="56" rx="4" fill="url(#lattice)" stroke="#fff" stroke-width="1.5" />
    </g>
  </defs>
  <style>
    .card { stroke: #1b242b; stroke-width: 1.5; }
  </style>
  <g transform="translate(0 0)" filter="url(#shadow)">
    <rect class="card" x="12" y="4" width="40" height="56" rx="4" fill="#f7adad" />
